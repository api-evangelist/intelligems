- aid: intelligems:intelligems-create-experience-api
  name: Intelligems Create Experience API
  description: >-
    The following experience types are supported by the Intelligems Experiments API:


    - `content/advanced` — Advanced content test (custom CSS/JS injection)

    - `content/onsiteEdits` — Onsite edits (visual editor changes)

    - `content/url` — URL redirects

    - `content/theme` — Theme redirects

    - `content/template` — Template redirects

    - `personalization` — Personalization rules

    - `personalization/offer` — Offer test (structured discount campaigns configured via the `offer` field
    on each variation)


    The following test types are not currently supported via this API:


    - Checkout Blocks

    - Pricing

    - Shipping

    - Campaigns


    All fields (experience metadata, variations, audience, page targeting, and key metrics) are nested
    inside a single `experience` object in the request body.
  humanURL: https://docs.intelligems.io/developer-resources/external-api
  baseURL: https://api.intelligems.io
