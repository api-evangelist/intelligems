aid: intelligems
name: Intelligems
description: >-
  Intelligems is an AI-powered A/B testing, pricing optimization, and
  personalization platform for ecommerce stores, built primarily as a Shopify
  app. Merchants use it to test and personalize product and subscription
  pricing, discounts and offers, shipping strategies, content and landing pages,
  the checkout experience, and post-purchase offers, then measure the profit
  impact with built-in analytics. For developers, Intelligems exposes a REST
  External API (manage experiences and pull experiment and sitewide analytics),
  a client-side JavaScript API (window.igData), a headless React SDK
  (@intelligems/headless), and an official hosted MCP server with 30 tools that
  connects experiments, Shopify store data, and analytics to Claude, ChatGPT,
  and Gemini.
