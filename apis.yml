- aid: intelligems:intelligems-update-experience-api
  name: Intelligems Update Experience API
  description: >-
    Updates an existing experience. This is a full PUT replacement — the entire experience configuration
    is replaced with the provided data.


    All required fields must be included in every request. Any optional fields omitted will be reset to
    their defaults.


    All nested entities (variations, key metrics, page targeting, audience) must include their `id` field
    from the original GET response. All fields are nested inside a single `experience` object in the request
    body.
  humanURL: https://docs.intelligems.io/developer-resources/external-api
