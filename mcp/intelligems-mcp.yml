server:
  name: intelligems
  transport: http
  url: https://ai.intelligems.io/mcp
  sse_url: https://ai.intelligems.io/mcp/sse
  auth: oauth2
  auth_notes: >-
    OAuth2-authenticated. During setup you authenticate with an Intelligems
    organization account; most tools accept an optional `organization` parameter
    to select which organization's data to access.
  clients:
    - name: Claude
      docs: https://docs.intelligems.io/developer-resources/mcp-server/claude
      recommended: true
