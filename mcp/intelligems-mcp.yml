source: https://docs.intelligems.io/developer-resources/mcp-server/available-tools
note: >-
  Rewritten 2026-08-13 from Intelligems' own "Available Tools" reference. The tool surface
  has grown from the 30 tools captured on 2026-07-19 to 46, adding the price-test
  prepare/review/commit tools, the get_variation_* analytics family, the Shopify
  catalog/ShopifyQL reporting tools and get_shop_info; `switch_organization` is gone (every
  tool now takes an optional `organization` parameter instead). Live `tools/list`
  introspection is OAuth-gated (HTTP 401 + WWW-Authenticate), so tool names, descriptions
  and parameters below are the provider's published documentation rather than a live
  schema dump — no inputSchema is asserted. The previous version of this file had a YAML
  quoting defect that split tool descriptions on commas and lost one tool name; that is
  fixed here.
deployment:
  mode: remote
  endpoint: https://ai.intelligems.io/mcp
  auth: oauth
  verified: probed
  probe:
    url: https://ai.intelligems.io/mcp
    method: POST tools/list
    status: 401
    challenge: 'Bearer realm="mcp", resource="https://ai.intelligems.io/mcp"'
    checked: '2026-08-13'
  note: >-
    Hosted remote server — an MCP client POSTs directly to the endpoint after an OAuth
    authorization-code (PKCE S256) flow with dynamic client registration. Intelligems
    ships no stdio package; there is nothing to npx or pip install.
server:
  name: intelligems
  transport: http
  url: https://ai.intelligems.io/mcp
  sse_url: https://ai.intelligems.io/mcp/sse
  auth: oauth2
  auth_metadata:
    authorization_server: https://ai.intelligems.io/.well-known/oauth-authorization-server
    protected_resource: https://ai.intelligems.io/.well-known/oauth-protected-resource
    scopes: [member]
  auth_notes: >-
    Authenticate with an Intelligems organization account during client setup. Every tool
    accepts an optional `organization` parameter (name or ID) so agencies and multi-store
    operators can work across organizations in one session.
  conventions:
    ids: Experience and experiment IDs are UUIDs.
    currency: Money values are returned in the store's default currency; check with get_shop_info.
    large_results: >-
      Tools that can return very large datasets (exports, full price matrices) return a
      presigned S3 download URL valid for roughly 15 minutes instead of inlining data.
    writes: Write tools prompt the user for confirmation in the AI client.
  clients:
    - {name: Claude, docs: 'https://docs.intelligems.io/developer-resources/mcp-server/claude', recommended: true}
    - {name: ChatGPT, docs: 'https://docs.intelligems.io/developer-resources/mcp-server/chatgpt'}
    - {name: Google Gemini, docs: 'https://docs.intelligems.io/developer-resources/mcp-server/google-gemini'}
tool_count: 46
tools:
  - name: list_organizations
    category: organization
    description: "List all Intelligems organizations you have access to; filter by installation status and sort."
    parameters: [isInstalled, sortBy, nameContains, limit]
  - name: get_organization
    category: organization
    description: "Organization detail including currency, timezone, Shopify settings and enabled features."
    parameters: [organization]
  - name: get_shop_info
    category: organization
    description: "Store metadata: store name, domain, currency, Shopify plan and timezone."
    parameters: [organization]
  - name: list_integrations
    category: organization
    description: "List active integrations for an organization (Google Analytics, Klaviyo, Recharge, Slack, etc.)."
    parameters: [enabled, integrationName, nameContains, limit, organization]
  - name: search_experiments
    category: discovery
    description: "Find A/B tests, price tests and experiments; returns minimal info (id, name, status, type, timestamps, variation count)."
    parameters: [status, nameContains, sortBy, sortOrder, limit, page, organization]
  - name: search_experiences
    category: discovery
    description: "Same as search_experiments but for experiences (long-running, evergreen shopper experiences)."
    parameters: [status, nameContains, sortBy, sortOrder, limit, page, organization]
  - name: list_experiments
    category: discovery
    description: "Full experiment details including variations, targeting rules and configuration."
    parameters: [status, nameContains, sortBy, sortOrder, limit, page, organization]
  - name: get_experiences_list_full
    category: discovery
    description: "Full experience details including variations, targeting rules and configuration."
    parameters: [status, nameContains, sortBy, sortOrder, limit, page, organization]
  - name: get_experience
    category: discovery
    description: "Detailed information about one specific experiment or experience."
    parameters: [id, organization]
  - name: get_experience_metrics_config
    category: discovery
    description: "The success metrics configured for a test (revenue, conversion rate, AOV, custom goals) — configuration only, not results."
    parameters: [experienceId, organization]
  - name: create_experience
    category: write
    description: "Create a new experience or experiment; created as a draft that reaches no shoppers until started."
    parameters: [experience configuration fields, organization]
  - name: update_experience
    category: write
    description: "Update the non-price fields of an experience: metadata, variations, targeting rules, traffic allocation."
    parameters: [id, fields to change, organization]
  - name: experience_action
    category: write
    description: "Perform a lifecycle action on an experience: start, pause or end."
    parameters: [id, action, organization]
  - name: get_price_test_products
    category: price-test
    description: "Read current per-variant prices and test groups for a price test; large result sets return a presigned S3 URL."
    parameters: [experienceId, productTitleContains, variantTitleContains, organization]
  - name: prepare_price_test_products
    category: price-test
    description: "Stage a relative price transform (percent or dollar delta, optional rounding) across a test group and return a diff plus a productVariantAction reference."
    parameters: [experienceId, scope, transform, organization]
  - name: commit_price_test_products
    category: price-test
    description: "Apply a staged price change by passing back the productVariantAction reference; processed asynchronously."
    parameters: [experienceId, productVariantAction, organization]
  - name: analyze_experience
    category: analytics
    description: "The main results tool — performance metrics, statistical significance and variation comparisons, with optional verdict and rendered charts."
    parameters: [experienceId, view, audience, testResult, analyticsViewType, includeInTestOrders, topN, graphs, start, end, filters, organization]
  - name: get_variation_overview
    category: analytics
    description: "Overall performance metrics per variation with uplift vs control, p2bb, p2bc and confidence intervals."
    parameters: [id, metrics, startTs, endTs, filters, organization]
  - name: get_variation_audience
    category: analytics
    description: "The same metrics as get_variation_overview broken out per segment per variation."
    parameters: [id, audience, topN, metrics, startTs, endTs, filters, organization]
  - name: get_variation_products
    category: analytics
    description: "Product-level or variant-level test metrics per variation, including profit columns when COGS is configured."
    parameters: [id, returnVariants, topN, includeCheckoutUpsellBreakdown, includePostPurchaseOfferBreakdown, filters, organization]
  - name: get_variation_timeseries
    category: analytics
    description: "Test metrics over time per variation, cumulative or discrete."
    parameters: [id, interval, mode, metrics, startTs, endTs, filters, organization]
  - name: get_experience_timeseries
