note: >-
  Binds each of the 46 published Intelligems MCP tools to the backing External API
  operation(s) where one exists. Live tools/list introspection is OAuth-gated (401), so
  bindings are made by name and documented semantics, not by comparing inputSchemas —
  confidence is set accordingly. The two surfaces are close but NOT identical: the MCP
  server reaches through to Shopify (catalog, ShopifyQL sales reporting) and adds a
  price-test prepare/commit workflow and chart rendering that the REST API does not
  expose, while the REST API's custom-event authoring has no MCP tool.
