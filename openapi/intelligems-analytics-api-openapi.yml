                        matching nothing. ''isNull''/''isNotNull'' take no values; omit the field (an empty array
                        is tolerated, real values are rejected). Multiple values within a single item are OR''d.
                        How items in the array are combined is controlled by landingPageFiltersOperator.'
                      type: array
                      items:
                        type: object
                        properties:
                          values:
                            type: array
                            items:
                              type: string
                          filterType:
                            type: string
                            enum:
                            - equals
                            - contains
                            - startsWith
                            - endsWith
                            - doesNotEqual
                            - doesNotContain
                            - doesNotStartWith
