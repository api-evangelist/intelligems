      operationId: getExperienceAnalytics
      summary: Fetch experience analytics (deprecated)
      x-source-page: https://docs.intelligems.io/developer-resources/external-api/fetch-experience-data
    post:
      tags:
      - Analytics
      description: Retrieve analytics for an experience (metrics, variations, optional graphs). Accepts filters
        and all request settings in the JSON body.
      parameters:
      - in: path
        name: experienceId
        schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                view:
                  default: overview
                  description: Resource view to analyze. Supported values are 'overview' for variation-level metrics,
                    'audience' for a breakdown by the selected audience dimension, and 'post_test' for post-test
                    metrics (customers who converted during the test, tracked by their purchase behavior after that
                    conversion, split by variation).
                  type: string
                  enum:
                  - overview
                  - audience
                  - post_test
                audience:
                  description: Audience breakdown dimension. Required when `view` is `audience`. Optional when `view`
                    is `post_test` (returns the post-test breakdown by the selected dimension). Not allowed when
                    `view` is `overview`. Use one of the supported audience fields such as `device_type`, `visitor_type`,
                    or `source_channel`.
                  type: string
                  enum:
                  - device_type
                  - visitor_type
                  - source_channel
                  - source_site
                  - country_code
                  - landing_page_full_path
                includeInTestOrders:
                  default: true
                  description: Only applies when `view` is `post_test`. Controls whether in-test orders are folded
                    into the metrics. When `true` (default), the in-test `eso_*` family is included and `total_*`
                    is the LTV view (post-test + in-test combined). When `false`, the `eso_*` family is omitted
                    and `total_*` collapses to equal `post_*`. The `post_*` family and headcounts/rates are always
                    returned.
                  type: boolean
                analyticsViewType:
                  description: Optional analytics view preset used by the backend when building the analysis request.
                  type: string
                  enum:
                  - test_orders_only
                  - sitewide_orders
                  - none
                endTs:
                  description: Optional analysis end timestamp as a 10-digit Unix epoch string in seconds (not milliseconds).
                    Maps directly to the backend `endTs` field.
                  type: string
                startTs:
                  description: Optional analysis start timestamp as a 10-digit Unix epoch string in seconds (not
                    milliseconds). Maps directly to the backend `startTs` field.
                  type: string
                graphs:
                  type: object
                  properties:
                    ids:
                      description: 'Array of graph IDs to render in the response. Valid values (30): conversion_rate,
                        add_to_cart_rate, abandoned_cart_rate, abandoned_checkout_rate, checkout_begin_rate, checkout_enter_contact_info_rate,
                        checkout_address_submitted_rate, view_product_page_rate, view_collection_page_rate, net_revenue_per_visitor,
                        net_revenue_per_order, net_product_revenue_per_order, net_shipping_revenue_per_order, avg_units_per_order,
                        avg_product_revenue_per_unit, profit_per_visitor, subscription_product_revenue_per_order,
                        subscription_revenue_per_order, subscription_orders_per_visitor, subscription_revenue_per_visitor,
                        subscription_profit_per_visitor, profit_per_order, pct_orders_free_shipping, avg_discount_per_discounted_order,
                        avg_discount_per_all_orders, pct_subscription_orders, pct_orders_with_post_purchase_offer,
                        net_revenue_from_post_purchase_offer, pct_orders_with_upsell, net_revenue_from_upsell. Note
                        that ''revenue_per_visitor'' is NOT valid — use ''net_revenue_per_visitor''.'
                      type: array
                      items:
                        type: string
                        enum:
                        - conversion_rate
                        - add_to_cart_rate
                        - abandoned_cart_rate
                        - abandoned_checkout_rate
                        - checkout_begin_rate
                        - checkout_enter_contact_info_rate
                        - checkout_address_submitted_rate
                        - view_product_page_rate
                        - view_collection_page_rate
                        - net_revenue_per_visitor
                        - net_revenue_per_order
                        - net_product_revenue_per_order
                        - net_shipping_revenue_per_order
                        - avg_units_per_order
                        - avg_product_revenue_per_unit
                        - profit_per_visitor
                        - subscription_product_revenue_per_order
                        - subscription_revenue_per_order
                        - subscription_orders_per_visitor
                        - subscription_revenue_per_visitor
                        - subscription_profit_per_visitor
                        - profit_per_order
                        - pct_orders_free_shipping
                        - avg_discount_per_discounted_order
                        - avg_discount_per_all_orders
                        - pct_subscription_orders
                        - pct_orders_with_post_purchase_offer
                        - net_revenue_from_post_purchase_offer
                        - pct_orders_with_upsell
                        - net_revenue_from_upsell
                    outputFormat:
                      description: Graph output format. Use `png` for signed image URLs or `base64` to inline the
                        PNG data in the response.
                      type: string
                      enum:
                      - png
                      - base64
                filters:
                  description: 'Structured analytics filters object for `POST /analytics/resource/{experienceId}`.
                    This replaces the deprecated GET endpoint''s query-parameter filter pattern and supports device,
                    visitor, traffic source, URL, user behavior, revenue, custom event, product, and targeting filters.


                    Analytics filters object for narrowing experience/experiment result data.'
                  type: object
                  properties:
                    deviceType:
                      description: 'Filter by device type. Options: ''any'' (disables filter), ''mobile'', ''desktop''.
                        Omit or null to include all devices.'
                      anyOf:
                      - type: string
                        enum:
                        - any
                        - mobile
                        - desktop
                      - type: 'null'
                    visitorType:
                      description: 'Filter by visitor type. Options: ''any'' (disables filter), ''new'', ''returning''.
                        Omit or null to include all visitors.'
                      anyOf:
                      - type: string
                        enum:
                        - any
                        - new
                        - returning
                      - type: 'null'
                    customerType:
                      description: 'Filter experiment analytics by customer type. Options: ''new'', ''returning''.
                        Omit or null to include all customers.'
                      anyOf:
                      - type: string
                        enum:
                        - new
                        - returning
                      - type: 'null'
                    sourceSitesOrChannels:
                      description: 'Filter by traffic source channels. These 25 values are the complete accepted
                        set — the channels the analytics service buckets sessions and orders into — and any other
                        value is rejected with a 400: ''Instagram'', ''Facebook'', ''Google'', ''Twitter'', ''TikTok'',
                        ''Youtube'', ''Klaviyo'', ''Attentive'', ''Postscript'', ''Paid Shopping'', ''Paid Search'',
                        ''Paid Social'', ''Paid Video'', ''Display'', ''Paid Other'', ''Organic Shopping'', ''Organic
                        Social'', ''Organic Video'', ''Organic Search'', ''Other'', ''Referral'', ''Affiliate'',
                        ''SMS'', ''Email'', ''Direct''. Omit or pass an empty array for all channels — there is
                        no ''any'' sentinel.'
                      type: array
                      items:
                        type: string
                        enum:
                        - Instagram
                        - Facebook
                        - Google
                        - Twitter
                        - TikTok
                        - Youtube
                        - Klaviyo
                        - Attentive
                        - Postscript
                        - Paid Shopping
                        - Paid Search
                        - Paid Social
                        - Paid Video
                        - Display
                        - Paid Other
                        - Organic Shopping
                        - Organic Social
                        - Organic Video
                        - Organic Search
                        - Other
                        - Referral
                        - Affiliate
                        - SMS
                        - Email
                        - Direct
                    urlParam:
                      description: 'Filter by URL query parameter. Object with: queryParam (string|null — the parameter
                        name), queryParamValue (string|null — the value to match), queryParamFilterType (match operator|null:
                        ''equals'', ''contains'', ''startsWith'', ''endsWith'', ''doesNotEqual'', ''doesNotContain'',
                        ''doesNotStartWith'', ''doesNotEndWith'', ''isNull'', ''isNotNull''). REQUIRED COMBINATIONS
                        (enforced with a 400): when queryParamFilterType is set, queryParam must be a non-empty
                        string; every operator except ''isNull''/''isNotNull'' also requires a non-empty queryParamValue;
                        ''isNull''/''isNotNull'' take no value, so leave queryParamValue null. Omit all three fields
                        to apply no query-parameter filter.'
                      type: object
                      properties:
                        queryParam:
                          anyOf:
                          - type: string
                          - type: 'null'
                        queryParamValue:
                          anyOf:
                          - type: string
                          - type: 'null'
                        queryParamFilterType:
                          anyOf:
                          - type: string
                            enum:
                            - equals
                            - contains
                            - startsWith
                            - endsWith
                            - doesNotEqual
                            - doesNotContain
                            - doesNotStartWith
                            - doesNotEndWith
                            - isNull
                            - isNotNull
                          - type: 'null'
                      required:
                      - queryParam
                      - queryParamValue
                      - queryParamFilterType
                    landingPage:
                      description: 'DEPRECATED — use landingPageFilters instead, which supports multiple values
                        and an and/or operator. This single-path filter is retained for backwards compatibility
                        and still works, but new integrations should use landingPageFilters. Filter by landing page
                        URL path. Object with: landingPageUrlPath (string|null — the path to match), landingPageUrlPathFilterType
                        (match operator|null: ''equals'', ''contains'', ''startsWith'', ''endsWith'', ''doesNotEqual'',
                        ''doesNotContain'', ''doesNotStartWith'', ''doesNotEndWith'', ''isNull'', ''isNotNull'').
                        REQUIRED COMBINATIONS (enforced with a 400): every operator except ''isNull''/''isNotNull''
                        requires a non-empty landingPageUrlPath; ''isNull''/''isNotNull'' take no path, so leave
                        landingPageUrlPath null; and a landingPageUrlPath with no landingPageUrlPathFilterType is
                        rejected. Omit both fields to apply no landing-page filter.'
                      deprecated: true
                      anyOf:
                      - type: object
                        properties:
                          landingPageUrlPath:
                            anyOf:
                            - type: string
                            - type: 'null'
                          landingPageUrlPathFilterType:
                            anyOf:
                            - type: string
                              enum:
                              - equals
                              - contains
                              - startsWith
                              - endsWith
                              - doesNotEqual
                              - doesNotContain
                              - doesNotStartWith
                              - doesNotEndWith
                              - isNull
                              - isNotNull
                            - type: 'null'
                        required:
                        - landingPageUrlPath
                        - landingPageUrlPathFilterType
                      - type: 'null'
                    landingPageFilters:
                      description: 'Filter by landing page URL path with multi-value support. Recommended landing
                        page filter (supersedes the deprecated landingPage field). Array of filter items, each with:
                        filterType (match operator: ''equals'', ''contains'', ''startsWith'', ''endsWith'', ''doesNotEqual'',
                        ''doesNotContain'', ''doesNotStartWith'', ''doesNotEndWith'', ''isNull'', ''isNotNull'')
                        and values (array of strings to match against). REQUIRED COMBINATIONS (enforced with a 400):
                        every operator except ''isNull''/''isNotNull'' requires at least one non-empty entry in
                        values — an omitted, empty, or blank-only values array is rejected rather than silently
                        matching nothing. ''isNull''/''isNotNull'' take no values; omit the field (an empty array
                        is tolerated, real values are rejected). Multiple values within a single item are OR''d.
                        How items in the array are combined is controlled by landingPageFiltersOperator.'
                      type: array
                      items:
                        type: object
                        properties:
                          values:
                            type: array
                            items:
                              type: string
                          filterType:
                            type: string
                            enum:
                            - equals
                            - contains
                            - startsWith
                            - endsWith
                            - doesNotEqual
                            - doesNotContain
                            - doesNotStartWith
                            - doesNotEndWith
                            - isNull
                            - isNotNull
                        required:
                        - filterType
                    landingPageFiltersOperator:
                      description: How multiple items in landingPageFilters are combined. 'or' (default) — session
                        matches if any filter item matches. 'and' — session must match every filter item.
                      type: string
                      enum:
                      - or
                      - and
                    userBehavior:
                      description: 'Filter by visitor browsing behavior. Object with optional boolean flags: viewedCheckout,
                        addedToCart, viewedProductPage, viewedCollectionPage. Set a flag to true to include only
                        visitors who performed that action. Omit or null for flags you don''t want to filter on.
                        Multiple true flags are combined with AND logic.'
                      type: object
                      properties:
                        viewedCheckout:
                          anyOf:
                          - type: boolean
                          - type: 'null'
                        addedToCart:
                          anyOf:
                          - type: boolean
                          - type: 'null'
                        viewedProductPage:
                          anyOf:
                          - type: boolean
                          - type: 'null'
                        viewedCollectionPage:
                          anyOf:
                          - type: boolean
                          - type: 'null'
                    countryCodes:
                      description: Filter by ISO 3166-1 alpha-2 country codes (e.g. ['US', 'GB', 'CA']). Omit or
                        pass empty array for all countries.
                      type: array
                      items:
                        type: string
                    countryCodesFilterType:
                      description: 'How countryCodes should be matched: ''include'' (only visitors in the listed
                        countries) or ''exclude'' (visitors in any country except the listed ones). Defaults to
                        ''include'' when omitted. Requires countryCodes to be a non-empty array.'
                      type: string
                      enum:
                      - include
                      - exclude
                    maxZScore:
                      description: Maximum Z-score threshold for outlier filtering on order revenue. Visitors with
                        orders whose Z-score exceeds this value are excluded. Accepts number or numeric string.
                        Null or omit to disable outlier filtering.
                      anyOf:
                      - anyOf:
                        - type: number
                        - type: string
                      - type: 'null'
                    triggeredCustomEvents:
                      description: Filter by custom event identifiers that visitors must have triggered. Requires
                        customEventsFilterType to be set to control matching logic. Has no effect without customEventsFilterType.
                        Pull this field from the GET https://api.intelligems.io/v25-10-beta/experiences/{experienceId}
                        endpoint > experienceCustomMetrics > customEvent > identifier field.
                      type: array
                      items:
                        type: string
                    customEventsFilterType:
                      description: 'How triggeredCustomEvents should be matched: ''any'' (visitor triggered at least
                        one), ''all'' (visitor triggered every listed event), ''none'' (visitor triggered none of
                        the listed events). Requires triggeredCustomEvents to be a non-empty array.'
                      type: string
                      enum:
                      - any
                      - all
                      - none
                    reachedCheckoutStage:
                      description: 'Filter to visitors who reached at least the given checkout stage. Options: ''started'',
                        ''contact_info_submitted'', ''address_info_submitted''. Omit or null to not filter by checkout
                        stage.'
                      anyOf:
                      - type: string
                        enum:
                        - started
                        - contact_info_submitted
                        - address_info_submitted
                      - type: 'null'
                    minNetRevenue:
                      description: Minimum order net revenue to include (inclusive). Accepts number or numeric string.
                        Omit or null to not apply a minimum.
                      anyOf:
                      - anyOf:
                        - type: number
                        - type: string
                      - type: 'null'
                    maxNetRevenue:
                      description: Maximum order net revenue to include (inclusive). Accepts number or numeric string.
                        Omit or null to not apply a maximum.
                      anyOf:
                      - anyOf:
                        - type: number
                        - type: string
                      - type: 'null'
                    minShippingRevenue:
                      description: Minimum shipping revenue to include (inclusive). Accepts number or numeric string.
                        Omit or null to not apply a minimum.
                      anyOf:
                      - anyOf:
                        - type: number
                        - type: string
                      - type: 'null'
                    maxShippingRevenue:
                      description: Maximum shipping revenue to include (inclusive). Accepts number or numeric string.
                        Omit or null to not apply a maximum.
                      anyOf:
                      - anyOf:
                        - type: number
                        - type: string
                      - type: 'null'
                    shippingMethods:
                      description: Filter by shipping method names. Only orders using one of these methods are included.
                      type: array
                      items:
                        type: string
                    onlyProductIds:
                      description: Filter to only include specific Shopify product IDs (numeric strings).
                      anyOf:
                      - type: array
                        items:
                          type: string
                      - type: 'null'
                    landingPageTypes:
                      description: 'Filter sessions by landing page types. An array of values from: ''PDP'', ''Collection'',
                        ''Content'', ''Blog'', ''Homepage'', ''Search'', ''Cart'', ''Other''. Omit or null to include
                        all landing page types.'
                      type: array
                      items:
                        type: string
                        enum:
                        - PDP
                        - Collection
                        - Content
                        - Blog
                        - Homepage
                        - Search
                        - Cart
                        - Other
                    experimentProductsOnly:
                      description: When true, only include products that are part of the experiment. Only applies
                        when analyzing an experience/experiment.
                      anyOf:
                      - type: boolean
                      - type: 'null'
                    onlyProductHandles:
                      description: Filter to only include specific Shopify product handles.
                      anyOf:
                      - type: array
                        items:
                          type: string
                      - type: 'null'
                topN:
                  description: Only applies when `view` is `audience`. Caps the breakdown to the top N segments
                    by visitor count, where N is an integer between 1 and 1000. By default, only the high-cardinality
                    dimensions `country_code` and `landing_page_full_path` are capped at 10; the other dimensions
                    (`device_type`, `visitor_type`, `source_channel`, `source_site`) are low-cardinality and returned
                    in full. Set a value between 1 and 1000 to override the cap for any dimension. The 1000 maximum
                    bounds the response size and query cost — this is why `landing_page_full_path`, which can have
                    thousands of distinct URLs, is never returned in full.
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 1000
                testResult:
                  description: When true, compute and return the opt-in test verdict alongside the overview. The
                    verdict is returned on the response as `testResult`.
                  type: boolean
      responses:
        '200':
          description: OK
          headers:
            access-control-allow-origin:
              schema:
                type: string
              description: CORS allow-origin header.
            access-control-allow-credentials:
              schema:
                type: string
              description: CORS allow-credentials header.
            content-type:
              schema:
                type: string
              description: Response content type.
            Timing-Allow-Origin:
              schema:
                type: string
              description: Allowed origin for Timing headers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  datasetId:
                    type: string
                    enum:
                    - order_line_items
                    - orders
                    - aiProfit
                    - variation_overview
                    - variation_audience
                    - variation_timeseries_discrete
                    - variation_timeseries_cumulative
                    - experience_countries
                    - variation_shipping_method
                    - variation_histogram
                    - variation_products
                    - variation_product_groups
                    - variation_order_unit_mix
                    - custom_events_plugin
                    - custom_events_server
                    - order_reconciliation
                    - order_reconciliation_export
                    - experience_session_order
                    - timeseries
                    - country_codes
                    - snapshots
                    - experience_shipping_methods
                    - timeseries_audience
                    - snapshots_audience
                    - holiday_benchmarking_single_day
                    - holiday_benchmarking_multiple_days
                    - order_distribution_histogram
                    - order_distribution_unit_mix
                    - conversion_snapshots
                    - conversion_funnel
                    - conversion_timeseries
                    - variation_post_metrics
                    - variation_post_metrics_audience
                  latestRunTs:
                    type: number
                  cogsConfigured:
                    description: Whether cost of goods sold (COGS) is configured for the store (any revenue has
                      COGS data). When false, all profit metric values are null because they cannot be computed;
                      use revenue metrics instead. Only present when the request includes a profit metric.
                    type: boolean
                  cogsCoveragePct:
                    description: Fraction of revenue (0-1) backed by line items that have COGS data. 0 means profit
                      metrics are unavailable and returned as null. A value between 0 and 1 means profit is based
                      on partial COGS coverage; 1 means full coverage. Only present when the request includes a
                      profit metric.
                    type: number
                  metrics:
                    type: array
                    items: {}
                    description: "Array of metric objects. Each metric object may contain the following fields (all\
                      \ optional):\n\n**Dimension Fields:**\n- variation_id (string, UUID): The variation identifier\n\
                      - dt (string): Timestamp for time series data\n- audience (string): Audience segment identifier\n\
                      \n**Metric Fields (alphabetical):**\n- abandoned_cart_rate: Rate of abandoned carts\n- abandoned_checkout_rate:\
                      \ Rate of abandoned checkouts\n- add_to_cart_rate: Add to cart rate\n- avg_discount_per_all_orders:\
                      \ Average discount amount across all orders\n- avg_discount_per_discounted_order: Average\
                      \ discount amount for orders with discounts\n- avg_product_revenue_per_unit: Average revenue\
                      \ per product unit\n- avg_units_per_order: Average number of units per order\n- checkout_address_submitted_rate:\
                      \ Rate of checkouts with address submitted\n- checkout_begin_rate: Checkout initiation rate\n\
                      - checkout_enter_contact_info_rate: Rate of checkouts with contact info entered\n- conversion_rate:\
                      \ Conversion rate metric with statistical details\n- gross_profit_per_order: Gross profit\
                      \ per order. Requires COGS to be configured. Null when COGS are not configured (cogsConfigured\
                      \ is false). Based on partial COGS coverage when cogsCoveragePct is between 0 and 1.\n- gross_profit_per_visitor:\
                      \ Gross profit per visitor. Requires COGS to be configured. Null when COGS are not configured\
                      \ (cogsConfigured is false). Based on partial COGS coverage when cogsCoveragePct is between\
                      \ 0 and 1.\n- n_orders: Number of orders\n- n_visitors: Number of visitors\n- net_product_revenue_per_order:\
                      \ Average product revenue per order\n- net_revenue: Total net revenue\n- net_revenue_per_order:\
                      \ Average revenue per order\n- net_revenue_per_visitor: Average revenue per visitor (RPV).\n\
                      - net_shipping_revenue_per_order: Average shipping revenue per order\n- pct_orders_free_shipping:\
                      \ Percentage of orders with free shipping\n- pct_subscription_orders: Percentage of orders\
                      \ that are subscriptions\n- subscription_gross_profit_per_visitor: Gross profit from subscriptions\
                      \ per visitor. Requires COGS to be configured. Null when COGS are not configured (cogsConfigured\
                      \ is false).\n- subscription_orders_per_visitor: Subscription orders per visitor\n- subscription_revenue_per_order:\
                      \ Revenue from subscriptions per order\n- subscription_revenue_per_visitor: Revenue from subscriptions\
                      \ per visitor\n- view_collection_page_rate: Collection page view rate\n- view_product_page_rate:\
                      \ Product page view rate\n\n**Funnel visitor counts (returned by view=overview):**\n- n_visitors_viewed_product_page:\
                      \ Visitors who viewed a product page\n- n_visitors_viewed_collection_page: Visitors who viewed\
                      \ a collection page\n- n_visitors_added_to_cart: Visitors who added to cart\n- n_visitors_checkout_started:\
                      \ Visitors who started checkout\n- n_visitors_checkout_contact_info_submitted: Visitors who\
                      \ submitted contact info\n- n_visitors_checkout_address_info_submitted: Visitors who submitted\
                      \ address info\n- n_visitors_abandoned_cart: Visitors who abandoned a cart\n- n_visitors_abandoned_checkout:\
                      \ Visitors who abandoned a checkout\n- n_visitors_ordered: Visitors who placed an order\n\n\
                      **Absolute totals (returned by view=overview):**\n- net_product_revenue: Total net product\
                      \ revenue\n- gross_profit: Total gross profit. Requires COGS to be configured; null when cogsConfigured\
                      \ is false.\n- total_units: Total units sold\n- total_discount: Total discount amount\n- n_orders_discounted:\
                      \ Number of orders carrying a discount\n- pct_revenue_with_cogs: Fraction of revenue backed\
                      \ by line items with COGS data\n- n_subscription_orders: Number of subscription orders\n-\
                      \ subscription_product_revenue: Product revenue from subscription orders\n- subscription_units:\
                      \ Units sold in subscription orders\n\nNOTE: this list documents the commonly returned fields,\
                      \ but the response is driven by the store's configured metric catalogue and by the requested\
                      \ view, so additional metric keys may be present. Clients should tolerate unknown keys rather\
                      \ than validating against a closed set.\n\nEach statistical metric in the response contains:\n\
                      - value (number): The metric value\n- ci_low (number): Lower bound of the 95% confidence interval\n\
                      - ci_high (number): Upper bound of the 95% confidence interval\n- plus_minus (number): Half-width\
                      \ of the 95% confidence interval, i.e., (ci_high - ci_low) / 2\n- p2bb (number, 0-1): Probability\
                      \ to be Best\n- p2bc (number, 0-1): Probability to Beat Control\n- uplift (object): Relative\
                      \ lift over the control variation. Contains:\n  - value (number): The relative lift (e.g.,\
                      \ 0.12 = +12%)\n  - ci_low (number): Lower bound of the 95% confidence interval for the uplift\n\
                      \  - ci_high (number): Upper bound of the 95% confidence interval for the uplift\n  - plus_minus\
                      \ (number): Half-width of the uplift's 95% confidence interval\n\nNote: p2bc and uplift are\
                      \ relative to the control variation and appear only on non-control variations; they are absent\
                      \ on the control."
                  audienceOrder: {}
                  histogram: {}
                  kde: {}
                  cdf: {}
                  variations:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                          description: Server-generated. Read-only.
                        experienceId:
                          type: string
                          format: uuid
                          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                          description: References the parent experience.
                        name:
                          type: string
                          description: Display name (e.g., 'Control', 'Variant A'). Unique within the experience.
                        percentage:
                          type: number
                          description: Traffic allocation weight. All percentages across sibling variations must
                            sum to 100.
                        isControl:
                          default: false
                          description: The baseline variation all others are measured against. Exactly one per experience.
                          type: boolean
                        order:
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                          description: Display order in the analytics dashboard. 0-indexed.
                        priceChange:
                          description: Price adjustment amount for pricing-type experiences. Positive increases
                            price, negative discounts. Use priceChange for simple price A/B tests; use offer for
                            structured discount campaigns (tiered, BOGO, free shipping).
                          anyOf:
                          - type: string
                          - type: 'null'
                        priceChangeUnit:
                          description: 'How priceChange is applied: as a percentage of the original price or a fixed
                            monetary amount.'
                          anyOf:
                          - type: string
                            enum:
                            - percent
                            - dollar
                          - type: 'null'
                        priceRoundingType:
                          description: Rounding strategy applied after priceChange (e.g., round up, round down,
                            charm pricing).
                          anyOf:
                          - type: string
                            enum:
                            - none
                            - nearest
                            - up
                            - down
                          - type: 'null'
                        priceRoundingAmount:
                          description: Target value for rounding (e.g., 0.99 for charm pricing like $X.99).
                          anyOf:
                          - type: string
                          - type: 'null'
                        onsiteEdits:
                          default: []
                          description: DOM content modifications (text, HTML, image swaps, element removal). For
                            CSS styling changes, use onsiteInjections instead.
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                                description: Server-generated. Read-only.
                              onsiteEditType:
                                description: Content modification strategy (html, text, image, or hide).
                                anyOf:
                                - type: string
                                  enum:
                                  - html
                                  - text
                                  - image
                                  - hide
                                - type: 'null'
                              variationId:
                                type: string
                                format: uuid
                                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                                description: References the parent variation.
                              find:
                                anyOf:
                                - type: string
                                - type: 'null'
                                description: Pattern to locate on the page. Interpreted as regex when isRegex is
                                  true.
                              title:
                                description: Dashboard label for identifying this edit.
                                anyOf:
                                - type: string
                                - type: 'null'
                              isRegex:
                                default: false
                                description: When true, 'find' is treated as a regular expression.
                                type: boolean
                              replace:
                                default: ''
                                description: 'Replacement content. Interpretation depends on onsiteEditType: HTML
                                  markup, plain text, or image URL.'
                                type: string
                              querySelectors:
                                default:
                                - ''
                                description: CSS selectors scoping which DOM elements this edit targets (e.g., '.product-title').
                                type: array
                                items:
                                  type: string
                              skip:
                                default: false
                                description: When true, this edit is temporarily disabled without being deleted.
                                type: boolean
                              remove:
                                default: false
                                description: When true, the matched element is removed from the DOM instead of having
                                  its content replaced.
                                type: boolean
                              groupId:
                                description: Groups related edits together so they can be managed as a unit.
                                type: string
                              isHtml:
                                default: false
                                type: boolean
                              isImage:
