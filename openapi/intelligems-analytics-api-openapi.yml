      operationId: getSitewideSnapshot
      summary: Fetch sitewide snapshot
      x-source-page: https://docs.intelligems.io/developer-resources/external-api/fetch-sitewide-analytics
  /v25-10-beta/analytics/sitewide/timeseries:
    post:
      tags:
      - Analytics
      description: Metric-over-time data with configurable granularity and optional audience segmentation.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                start:
                  description: Start of analysis period as an ISO 8601 datetime string (e.g. '2025-01-01T00:00:00.000-05:00').
                    Defaults to the start of the week containing the date 12 weeks ago, in the store's timezone
                    (weeks start Monday), so the default start is week-aligned rather than exactly 84 days back.
                    Note the default differs per sitewide endpoint, so pass an explicit start if you need a specific
                    window.
                  type: string
                  format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                end:
                  description: End of analysis period as an ISO 8601 datetime string. Defaults to now.
                  type: string
                  format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                feature:
                  description: 'Optional metric-set selector. Object form, e.g. { "name": "performance" }. Values:
                    ''performance'' (headline KPI trend), ''order'' (order composition and per-unit economics),
                    ''conversion'' (funnel step rates), or { name: ''audience'', audience: ''<dimension>'' } for
                    a per-segment breakdown. Omit to receive every metric this endpoint produces. NOTE: the fields
                    behind each set are specific to this endpoint and differ from the sitewide snapshot endpoint''s
                    set of the same name, because the two run different underlying datasets.'
                  oneOf:
                  - type: object
                    properties:
                      name:
                        type: string
                        const: performance
                    required:
                    - name
                  - type: object
                    properties:
                      name:
                        type: string
                        const: audience
                      audience:
                        type: string
                        enum:
                        - device_type
                        - visitor_type
                        - source_channel
                        - source_site
                        - country_code
                        - landing_page_full_path
                        description: 'Optional audience breakdown dimension. When provided, returns per-segment
                          snapshot instead of site-level KPIs. Supported values: device_type, visitor_type, source_channel,
                          source_site, country_code, landing_page_full_path.'
                    required:
                    - name
                    - audience
                  - type: object
                    properties:
                      name:
                        type: string
                        const: order
                    required:
                    - name
                  - type: object
                    properties:
                      name:
                        type: string
                        const: conversion
                    required:
                    - name
                  type: object
                granularity:
                  default: week
                  description: 'Time bucket granularity. Supported values: day, week, month. Defaults to week.'
                  type: string
                  enum:
                  - day
                  - week
                  - month
                filters:
                  description: Optional analytics filters object. See the Filters Reference for available filter
                    fields.
                  type: object
                  properties:
                    deviceType:
                      description: 'Filter by device type. Options: ''any'' (disables filter), ''mobile'', ''desktop''.
                        Omit or null to include all devices.'
                      anyOf:
                      - type: string
                        enum:
                        - any
                        - mobile
                        - desktop
                      - type: 'null'
                    visitorType:
                      description: 'Filter by visitor type. Options: ''any'' (disables filter), ''new'', ''returning''.
                        Omit or null to include all visitors.'
                      anyOf:
                      - type: string
                        enum:
                        - any
                        - new
                        - returning
                      - type: 'null'
                    customerType:
                      description: 'Filter by customer type. Options: ''new'', ''returning''. Omit or null to include
                        all customers.'
                      anyOf:
                      - type: string
                        enum:
                        - new
                        - returning
                      - type: 'null'
                    sourceSitesOrChannels:
