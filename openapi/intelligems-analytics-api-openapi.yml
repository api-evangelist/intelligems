                        type: string
                        enum:
                        - PDP
                        - Collection
                        - Content
                        - Blog
                        - Homepage
                        - Search
                        - Cart
                        - Other
                    experimentProductsOnly:
                      description: When true, only include products that are part of the experiment. Only applies
                        when analyzing an experience/experiment.
                      anyOf:
                      - type: boolean
                      - type: 'null'
                    onlyProductHandles:
                      description: Filter to only include specific Shopify product handles.
                      anyOf:
                      - type: array
