                                    additionalProperties: false
                              required:
                              - variantId
                              - variantTitle
                              - price
                              - inclusionType
                              additionalProperties: false
                        required:
                        - order
                        - productId
                        - productTitle
                        - variants
                        additionalProperties: false
                required:
