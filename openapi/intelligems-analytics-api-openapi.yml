                    landingPageFiltersOperator:
                      description: How multiple items in landingPageFilters are combined. 'or' (default) — session
                        matches if any filter item matches. 'and' — session must match every filter item.
                      type: string
                      enum:
                      - or
                      - and
                    userBehavior:
                      description: 'Filter by visitor browsing behavior. Object with optional boolean flags: viewedCheckout,
                        addedToCart, viewedProductPage, viewedCollectionPage. Set a flag to true to include only
                        visitors who performed that action. Omit or null for flags you don''t want to filter on.
                        Multiple true flags are combined with AND logic.'
                      type: object
                      properties:
                        viewedCheckout:
                          anyOf:
                          - type: boolean
                          - type: 'null'
                        addedToCart:
                          anyOf:
                          - type: boolean
                          - type: 'null'
                        viewedProductPage:
                          anyOf:
                          - type: boolean
                          - type: 'null'
                        viewedCollectionPage:
                          anyOf:
                          - type: boolean
                          - type: 'null'
                    countryCodes:
                      description: Filter by ISO 3166-1 alpha-2 country codes (e.g. ['US', 'GB', 'CA']). Omit or
                        pass empty array for all countries.
                      type: array
                      items:
                        type: string
                    countryCodesFilterType:
                      description: 'How countryCodes should be matched: ''include'' (only visitors in the listed
                        countries) or ''exclude'' (visitors in any country except the listed ones). Defaults to
                        ''include'' when omitted. Requires countryCodes to be a non-empty array.'
                      type: string
                      enum:
                      - include
                      - exclude
                    maxZScore:
                      description: Maximum Z-score threshold for outlier filtering on order revenue. Visitors with
                        orders whose Z-score exceeds this value are excluded. Accepts number or numeric string.
                        Null or omit to disable outlier filtering.
                      anyOf:
                      - anyOf:
                        - type: number
                        - type: string
                      - type: 'null'
                    triggeredCustomEvents:
                      description: Filter by custom event identifiers that visitors must have triggered. Requires
                        customEventsFilterType to be set to control matching logic. Has no effect without customEventsFilterType.
                        Pull this field from the GET https://api.intelligems.io/v25-10-beta/experiences/{experienceId}
                        endpoint > experienceCustomMetrics > customEvent > identifier field.
                      type: array
                      items:
                        type: string
                    customEventsFilterType:
                      description: 'How triggeredCustomEvents should be matched: ''any'' (visitor triggered at least
                        one), ''all'' (visitor triggered every listed event), ''none'' (visitor triggered none of
                        the listed events). Requires triggeredCustomEvents to be a non-empty array.'
                      type: string
                      enum:
                      - any
                      - all
                      - none
                    reachedCheckoutStage:
                      description: 'Filter to visitors who reached at least the given checkout stage. Options: ''started'',
                        ''contact_info_submitted'', ''address_info_submitted''. Omit or null to not filter by checkout
                        stage.'
                      anyOf:
                      - type: string
                        enum:
                        - started
                        - contact_info_submitted
                        - address_info_submitted
                      - type: 'null'
                    minNetRevenue:
                      description: Minimum order net revenue to include (inclusive). Accepts number or numeric string.
                        Omit or null to not apply a minimum.
                      anyOf:
                      - anyOf:
                        - type: number
                        - type: string
                      - type: 'null'
                    maxNetRevenue:
                      description: Maximum order net revenue to include (inclusive). Accepts number or numeric string.
                        Omit or null to not apply a maximum.
                      anyOf:
                      - anyOf:
                        - type: number
                        - type: string
                      - type: 'null'
                    minShippingRevenue:
                      description: Minimum shipping revenue to include (inclusive). Accepts number or numeric string.
                        Omit or null to not apply a minimum.
                      anyOf:
                      - anyOf:
                        - type: number
                        - type: string
                      - type: 'null'
                    maxShippingRevenue:
                      description: Maximum shipping revenue to include (inclusive). Accepts number or numeric string.
                        Omit or null to not apply a maximum.
                      anyOf:
                      - anyOf:
                        - type: number
                        - type: string
                      - type: 'null'
                    shippingMethods:
                      description: Filter by shipping method names. Only orders using one of these methods are included.
                      type: array
                      items:
                        type: string
                    onlyProductIds:
                      description: Filter to only include specific Shopify product IDs (numeric strings).
                      anyOf:
                      - type: array
                        items:
                          type: string
                      - type: 'null'
                    landingPageTypes:
                      description: 'Filter sessions by landing page types. An array of values from: ''PDP'', ''Collection'',
                        ''Content'', ''Blog'', ''Homepage'', ''Search'', ''Cart'', ''Other''. Omit or null to include
                        all landing page types.'
                      type: array
