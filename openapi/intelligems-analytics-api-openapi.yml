              schema:
                type: object
                properties:
                  exportType:
                    type: string
                    enum:
                    - orders
                    - order_line_items
                    - order_reconciliation
                    description: The type of export that was generated.
                  experienceId:
                    type: string
                    description: The UUID of the experience.
                  experienceName:
                    type: string
                    description: The display name of the experience.
                  url:
                    anyOf:
                    - type: string
                    - type: 'null'
                    description: Presigned S3 URL to download the CSV file. Valid for 15 minutes. Null if the export
