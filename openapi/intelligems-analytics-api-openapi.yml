                    deviceType:
                      description: 'Filter by device type. Options: ''any'' (disables filter), ''mobile'', ''desktop''.
                        Omit or null to include all devices.'
                      anyOf:
                      - type: string
                        enum:
                        - any
                        - mobile
                        - desktop
                      - type: 'null'
                    visitorType:
                      description: 'Filter by visitor type. Options: ''any'' (disables filter), ''new'', ''returning''.
                        Omit or null to include all visitors.'
                      anyOf:
                      - type: string
                        enum:
                        - any
                        - new
                        - returning
                      - type: 'null'
                    customerType:
                      description: 'Filter by customer type. Options: ''new'', ''returning''. Omit or null to include
                        all customers.'
                      anyOf:
                      - type: string
                        enum:
                        - new
                        - returning
                      - type: 'null'
                    sourceSitesOrChannels:
                      description: 'Filter by traffic source channels. These 25 values are the complete accepted
                        set — the channels the analytics service buckets sessions and orders into — and any other
                        value is rejected with a 400: ''Instagram'', ''Facebook'', ''Google'', ''Twitter'', ''TikTok'',
                        ''Youtube'', ''Klaviyo'', ''Attentive'', ''Postscript'', ''Paid Shopping'', ''Paid Search'',
                        ''Paid Social'', ''Paid Video'', ''Display'', ''Paid Other'', ''Organic Shopping'', ''Organic
                        Social'', ''Organic Video'', ''Organic Search'', ''Other'', ''Referral'', ''Affiliate'',
                        ''SMS'', ''Email'', ''Direct''. Omit or pass an empty array for all channels — there is
                        no ''any'' sentinel.'
                      type: array
                      items:
                        type: string
                        enum:
                        - Instagram
                        - Facebook
                        - Google
                        - Twitter
                        - TikTok
                        - Youtube
                        - Klaviyo
                        - Attentive
                        - Postscript
                        - Paid Shopping
                        - Paid Search
                        - Paid Social
                        - Paid Video
                        - Display
                        - Paid Other
                        - Organic Shopping
                        - Organic Social
                        - Organic Video
                        - Organic Search
                        - Other
                        - Referral
                        - Affiliate
                        - SMS
                        - Email
                        - Direct
                    landingPage:
                      description: 'DEPRECATED — use landingPageFilters instead, which supports multiple values
                        and an and/or operator. This single-path filter is retained for backwards compatibility
                        and still works, but new integrations should use landingPageFilters. Filter by landing page
                        URL path. Object with: landingPageUrlPath (string|null — the path to match), landingPageUrlPathFilterType
                        (match operator|null: ''equals'', ''contains'', ''startsWith'', ''endsWith'', ''doesNotEqual'',
                        ''doesNotContain'', ''doesNotStartWith'', ''doesNotEndWith'', ''isNull'', ''isNotNull'').
                        REQUIRED COMBINATIONS (enforced with a 400): every operator except ''isNull''/''isNotNull''
                        requires a non-empty landingPageUrlPath; ''isNull''/''isNotNull'' take no path, so leave
                        landingPageUrlPath null; and a landingPageUrlPath with no landingPageUrlPathFilterType is
                        rejected. Omit both fields to apply no landing-page filter.'
                      deprecated: true
                      anyOf:
                      - type: object
                        properties:
                          landingPageUrlPath:
                            anyOf:
                            - type: string
                            - type: 'null'
                          landingPageUrlPathFilterType:
                            anyOf:
                            - type: string
                              enum:
                              - equals
                              - contains
                              - startsWith
                              - endsWith
                              - doesNotEqual
                              - doesNotContain
                              - doesNotStartWith
                              - doesNotEndWith
                              - isNull
                              - isNotNull
                            - type: 'null'
                        required:
                        - landingPageUrlPath
                        - landingPageUrlPathFilterType
                      - type: 'null'
                    landingPageFilters:
                      description: 'Filter by landing page URL path with multi-value support. Recommended landing
                        page filter (supersedes the deprecated landingPage field). Array of filter items, each with:
                        filterType (match operator: ''equals'', ''contains'', ''startsWith'', ''endsWith'', ''doesNotEqual'',
                        ''doesNotContain'', ''doesNotStartWith'', ''doesNotEndWith'', ''isNull'', ''isNotNull'')
                        and values (array of strings to match against). REQUIRED COMBINATIONS (enforced with a 400):
                        every operator except ''isNull''/''isNotNull'' requires at least one non-empty entry in
                        values — an omitted, empty, or blank-only values array is rejected rather than silently
                        matching nothing. ''isNull''/''isNotNull'' take no values; omit the field (an empty array
                        is tolerated, real values are rejected). Multiple values within a single item are OR''d.
                        How items in the array are combined is controlled by landingPageFiltersOperator.'
                      type: array
                      items:
                        type: object
                        properties:
                          values:
                            type: array
                            items:
                              type: string
                          filterType:
                            type: string
                            enum:
                            - equals
                            - contains
                            - startsWith
                            - endsWith
                            - doesNotEqual
                            - doesNotContain
                            - doesNotStartWith
                            - doesNotEndWith
                            - isNull
                            - isNotNull
                        required:
                        - filterType
                    landingPageFiltersOperator:
                      description: How multiple items in landingPageFilters are combined. 'or' (default) — session
                        matches if any filter item matches. 'and' — session must match every filter item.
                      type: string
                      enum:
                      - or
                      - and
                    countryCodes:
                      description: Filter by ISO 3166-1 alpha-2 country codes (e.g. ['US', 'GB', 'CA']). Omit or
                        pass empty array for all countries.
                      type: array
                      items:
                        type: string
                    countryCodesFilterType:
                      description: 'How countryCodes should be matched: ''include'' (only visitors in the listed
                        countries) or ''exclude'' (visitors in any country except the listed ones). Defaults to
                        ''include'' when omitted. Requires countryCodes to be a non-empty array.'
                      type: string
                      enum:
                      - include
                      - exclude
                    currencyCodes:
                      description: Filter by ISO 4217 order currency codes (e.g. ['USD', 'GBP', 'CAD']). Matches
                        the currency an order was placed in. Omit or pass empty array for all currencies.
                      type: array
                      items:
                        type: string
                    currencyCodesFilterType:
                      description: 'How currencyCodes should be matched: ''include'' (only orders in the listed
                        currencies) or ''exclude'' (orders in any currency except the listed ones). Defaults to
                        ''include'' when omitted. Requires currencyCodes to be a non-empty array.'
                      type: string
                      enum:
                      - include
                      - exclude
                    maxZScore:
                      description: Maximum Z-score threshold for outlier filtering on order revenue. Visitors with
                        orders whose Z-score exceeds this value are excluded. Accepts number or numeric string.
                        Null or omit to disable outlier filtering.
                      anyOf:
                      - anyOf:
                        - type: number
                        - type: string
                      - type: 'null'
                    onlyProductIds:
                      description: Filter to orders containing at least one of these Shopify product IDs (numeric
                        strings, e.g. ['1234567890', '9876543210']). Omit or pass an empty array for all products.
                      type: array
                      items:
                        type: string
                    landingPageTypes:
                      description: 'Filter sessions by landing page types. An array of values from: ''PDP'', ''Collection'',
                        ''Content'', ''Blog'', ''Homepage'', ''Search'', ''Cart'', ''Other''. Omit or null to include
                        all landing page types.'
                      type: array
                      items:
                        type: string
                        enum:
                        - PDP
                        - Collection
                        - Content
                        - Blog
                        - Homepage
                        - Search
                        - Cart
                        - Other
                entryPoint:
                  default: device_type
                  description: 'Optional dimension that pivots the funnel''s step-1 entry-point nodes. This does
                    NOT filter the dataset — it only changes which buckets are rendered at step 1 (Mobile vs. Desktop,
                    New vs. Returning, channel breakdown, source-site breakdown). To narrow the dataset to a single
                    segment, use the `filters` object instead. Supported values: ''device_type'' (Mobile vs Desktop),
                    ''visitor_type'' (New vs Returning), ''source_channel'' (Paid Social, Paid Search, Direct, ...),
                    ''source_site'' (referrer host buckets). Any other value (typo, unsupported dimension, wrong
                    type) silently falls back to ''device_type''. Mirrors the Customer Journey chart''s audience
                    selector in the Intelligems dashboard. NOTE: this parameter was named `audience` in earlier
                    v25-10-beta builds (renamed to disambiguate it from the `audience` segmentation param on the
                    snapshot/timeseries endpoints). A legacy `audience` key sent to this endpoint is now ignored
                    — update integrations to `entryPoint`.'
                  type: string
                  enum:
                  - device_type
                  - visitor_type
                  - source_channel
                  - source_site
                conversionFunnel:
                  description: 'Optional funnel-specific filters. Stage flags (addedToCart, startedCheckout, converted,
                    bounced, abandonedCart, abandonedCheckout, exitedBeforeAtc, viewedCollectionPage, viewedProductPage)
                    narrow the funnel input to sessions that hit that behavioral stage. landingPageType / secondPageType
                    pin the funnel to a single landing-page or second-page journey (Supported page types: PDP, Collection,
                    Content, Blog, Homepage, Search, Cart, Other). Equivalent to the clickable node filters in the
                    Intelligems dashboard.'
                  type: object
                  properties:
                    abandonedCart:
                      type: boolean
                    abandonedCheckout:
                      type: boolean
                    addedToCart:
                      type: boolean
                    bounced:
                      type: boolean
                    converted:
                      type: boolean
                    exitedBeforeAtc:
                      type: boolean
                    startedCheckout:
                      type: boolean
                    viewedCollectionPage:
                      type: boolean
                    viewedProductPage:
                      type: boolean
                    landingPageType:
                      type: string
                      enum:
                      - PDP
                      - Collection
                      - Content
                      - Blog
                      - Homepage
                      - Search
                      - Cart
                      - Other
                    secondPageType:
                      type: string
                      enum:
                      - PDP
                      - Collection
                      - Content
                      - Blog
                      - Homepage
                      - Search
                      - Cart
                      - Other
      responses:
        '200':
          description: OK
          headers:
            access-control-allow-origin:
              schema:
                type: string
              description: CORS allow-origin header.
            access-control-allow-credentials:
              schema:
                type: string
              description: CORS allow-credentials header.
            content-type:
              schema:
                type: string
              description: Response content type.
            Timing-Allow-Origin:
              schema:
                type: string
              description: Allowed origin for Timing headers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      nodes:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              description: 'Node label, e.g. ''Mobile'', ''Landing: PDP'', ''Bounced'', ''Added
                                to Cart''.'
                            step:
                              type: number
                              description: 1-indexed step position in the funnel.
                            value:
                              type: number
                              description: Number of visitors at this node.
                            pct:
                              type: number
                              description: Share of step-1 visitors that reached this node, as a fraction in [0,
                                1] (not a percent).
                          required:
                          - name
                          - step
                          - value
                          - pct
                          additionalProperties: false
                        description: Sankey nodes — one per labeled state at each step in the funnel. Ordered by
                          (step ascending, value descending).
                      links:
                        type: array
                        items:
                          type: object
                          properties:
                            source:
                              type: string
                              description: Name of the source node for this transition.
                            target:
                              type: string
                              description: Name of the target node for this transition.
                            step:
                              type: number
                              description: Step of the source node.
                            value:
                              type: number
                              description: Number of visitors traversing this link.
                          required:
                          - source
                          - target
                          - step
                          - value
                          additionalProperties: false
                        description: Sankey links — one per transition between adjacent step nodes. Ordered by (step
                          ascending, value descending).
                    required:
                    - nodes
                    - links
                    additionalProperties: false
                    description: Sankey graph representation of the conversion funnel. Contains `nodes` (one per
                      labeled state at each step) and `links` (transitions between adjacent steps). Server-side
                      bucketing keeps only the top 5 entries per step plus catch-all 'Other' / 'Bounced' rollups.
                required:
                - data
                additionalProperties: false
        '400': *id001
        '401': *id002
        '429': *id004
        '500': *id005
      operationId: getSitewideConversionFunnel
      summary: Fetch sitewide conversion funnel
      x-source-page: https://docs.intelligems.io/developer-resources/external-api/fetch-sitewide-analytics
components:
  responses:
    OK:
      description: Success.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    ValidationError:
      description: Validation error (invalid query/body values). Per-field messages under properties.<field>.errors.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    Unauthorized:
      description: Unauthorized (invalid or missing API key).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
    RateLimited:
      description: Rate limit exceeded. See x-ratelimit-limit / x-ratelimit-remaining / x-ratelimit-reset headers.
      headers:
        x-ratelimit-limit:
          schema:
            type: integer
          description: Bucket size for the endpoint.
        x-ratelimit-remaining:
          schema:
            type: integer
          description: Remaining tokens in the current bucket.
        x-ratelimit-reset:
          schema:
            type: integer
          description: Unix timestamp (ms) at which the bucket next refills.
    ServerError:
      description: Internal server error.
  schemas:
    ValidationError:
      type: object
      description: Validation error envelope. Top-level errors[] is for request-level errors; per-field messages
        live under properties.<field>.errors.
      properties:
        errors:
          type: array
          items:
            type: string
        properties:
          type: object
          additionalProperties:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: string
    AuthError:
      type: object
      properties:
        error:
          type: string
          description: Error message, e.g. "Unauthorized" or "Unauthorized!".
    __schema0:
      type: object
      properties:
        discountType:
          default: none
          type: string
          enum:
          - none
          - percentage
          - fixed
        discountValue:
          anyOf:
          - type: number
          - type: 'null'
        compareAtPriceDisplay:
          default: none
          type: string
          enum:
          - none
          - compareAtPrice
          - regularPrice
        expression:
          type: array
          items:
            type: object
            properties:
              query:
                type: object
                properties:
                  key:
                    type: string
                    enum:
                    - shopifyRecommendations
                    - productId
                    - collection
                    - tag
                  type:
                    type: string
                    enum:
                    - shopifyRecommendations
                    - productId
                    - collection
                    - tag
                  filter:
                    type: string
                    enum:
                    - includes
                    - doesNotInclude
                  value:
                    anyOf:
                    - type: string
                    - type: number
                    - type: array
                      items:
                        type: object
                        properties:
                          order:
                            type: number
                          productId:
                            type: string
                          productTitle:
                            type: string
                          handle:
                            anyOf:
                            - type: string
                            - type: 'null'
                          productImage:
                            anyOf:
                            - type: string
                            - type: 'null'
                          description:
                            anyOf:
                            - type: string
                            - type: 'null'
                          options:
                            type: array
                            items:
                              type: object
                              properties:
                                name:
                                  type: string
                                values:
                                  type: array
                                  items:
                                    type: string
                              required:
                              - name
                              - values
                              additionalProperties: false
                          variants:
                            type: array
                            items:
                              type: object
                              properties:
                                variantId:
                                  type: string
                                variantTitle:
                                  type: string
                                variantImage:
                                  anyOf:
                                  - type: string
                                  - type: 'null'
                                price:
                                  type: number
                                compareAtPrice:
                                  anyOf:
                                  - type: number
                                  - type: 'null'
                                currencyCode:
                                  type: string
                                availableForSale:
                                  type: boolean
                                sig:
                                  anyOf:
                                  - type: string
                                  - type: 'null'
                                inclusionType:
                                  type: string
                                  enum:
