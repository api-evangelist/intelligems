                  latestRunTs:
                    type: number
                  cogsConfigured:
                    description: Whether cost of goods sold (COGS) is configured for the store (any revenue has COGS data). When false, all profit metric values are null because they cannot be computed; use revenue metrics instead. Only present when the request includes a profit metric.
                    type: boolean
                  cogsCoveragePct:
                    description: Fraction of revenue (0-1) backed by line items that have COGS data. 0 means profit metrics are unavailable and returned as null. A value between 0 and 1 means profit is based on partial COGS coverage; 1 means full coverage. Only present when the request includes a profit metric.
                    type: number
                  metrics:
                    type: array
                    items: {}
                    description: "Array of metric objects. Each metric object may contain the following fields (all optional):\n\n**Dimension Fields:**\n- variation_id (string, UUID): The variation identifier\n- dt (string): Timestamp for time series data\n- audience (string): Audience segment identifier\n\n**Metric Fields (alphabetical):**\n- abandoned_cart_rate: Rate of abandoned carts\n- abandoned_checkout_rate: Rate of abandoned checkouts\n- add_to_cart_rate: Add to cart rate\n- avg_discount_per_all_orders: Average discount amount across all orders\n- avg_discount_per_discounted_order: Average discount amount for orders with discounts\n- avg_product_revenue_per_unit: Average revenue per product unit\n- avg_units_per_order: Average number of units per order\n- checkout_address_submitted_rate: Rate of checkouts with address submitted\n- checkout_begin_rate: Checkout initiation rate\n- checkout_enter_contact_info_rate: Rate of checkouts with contact info entered\n- conversion_rate: Conversion rate metric with statistical details\n- gross_profit_per_order: Gross profit per order. Requires COGS to be configured. Null when COGS are not configured (cogsConfigured is false). Based on partial COGS coverage when cogsCoveragePct is between 0 and 1.\n- gross_profit_per_visitor: Gross profit per visitor. Requires COGS to be configured. Null when COGS are not configured (cogsConfigured is false). Based on partial COGS coverage when cogsCoveragePct is between 0 and 1.\n- n_orders: Number of orders\n- n_visitors: Number of visitors\n- net_product_revenue_per_order: Average product revenue per order\n- net_revenue: Total net revenue\n- net_revenue_per_order: Average revenue per order\n- net_revenue_per_visitor: Average revenue per visitor (RPV).\n- net_shipping_revenue_per_order: Average shipping revenue per order\n- pct_orders_free_shipping: Percentage of orders with free shipping\n- pct_subscription_orders: Percentage of orders that are subscriptions\n- subscription_gross_profit_per_visitor: Gross profit from subscriptions per visitor. Requires COGS to be configured. Null when COGS are not configured (cogsConfigured is false).\n- subscription_orders_per_visitor: Subscription orders per visitor\n- subscription_revenue_per_order: Revenue from subscriptions per order\n- subscription_revenue_per_visitor: Revenue from subscriptions per visitor\n- view_collection_page_rate: Collection page view rate\n- view_product_page_rate: Product page view rate\n\n**Funnel visitor counts (returned by view=overview):**\n- n_visitors_viewed_product_page: Visitors who viewed a product page\n- n_visitors_viewed_collection_page: Visitors who viewed a collection page\n- n_visitors_added_to_cart: Visitors who added to cart\n- n_visitors_checkout_started: Visitors who started checkout\n- n_visitors_checkout_contact_info_submitted: Visitors who submitted contact info\n- n_visitors_checkout_address_info_submitted: Visitors who submitted address info\n- n_visitors_abandoned_cart: Visitors who abandoned a cart\n- n_visitors_abandoned_checkout: Visitors who abandoned a checkout\n- n_visitors_ordered: Visitors who placed an order\n\n**Absolute totals (returned by view=overview):**\n- net_product_revenue: Total net product revenue\n- gross_profit: Total gross profit. Requires COGS to be configured; null when cogsConfigured is false.\n- total_units: Total units sold\n- total_discount: Total discount amount\n- n_orders_discounted: Number of orders carrying a discount\n- pct_revenue_with_cogs: Fraction of revenue backed by line items with COGS data\n- n_subscription_orders: Number of subscription orders\n- subscription_product_revenue: Product revenue from subscription orders\n- subscription_units: Units sold in subscription orders\n\nNOTE: this list documents the commonly returned fields, but the response is driven by the store's configured metric catalogue and by the requested view, so additional metric keys may be present. Clients should tolerate unknown keys rather than validating against a closed set.\n\nEach statistical metric in the response contains:\n- value (number): The metric value\n- ci_low (number): Lower bound of the 95% confidence interval\n- ci_high (number): Upper bound of the 95% confidence interval\n- plus_minus (number): Half-width of the 95% confidence interval, i.e., (ci_high - ci_low) / 2\n- p2bb (number, 0-1): Probability to be Best\n- p2bc (number, 0-1): Probability to Beat Control\n- uplift (object): Relative lift over the control variation. Contains:\n  - value (number): The relative lift (e.g., 0.12 = +12%)\n  - ci_low (number): Lower bound of the 95% confidence interval for the uplift\n  - ci_high (number): Upper bound of the 95% confidence interval for the uplift\n  - plus_minus (number): Half-width of the uplift's 95% confidence interval\n\nNote: p2bc and uplift are relative to the control variation and appear only on non-control variations; they are absent on the control."
                  audienceOrder: {}
                  histogram: {}
                  kde: {}
                  cdf: {}
