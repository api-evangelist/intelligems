    post:
      tags:
      - Fetch Experience Data
      description: Analyze analytics data for a specific experience using a POST request body for filters and request settings.
      parameters:
      - in: path
        name: experienceId
        schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                view:
                  default: overview
                  description: Resource view to analyze. Supported values are 'overview' for variation-level metrics, 'audience' for a breakdown by the selected audience dimension, and 'post_test' for post-test metrics (customers who converted during the test, tracked by their purchase behavior after that conversion, split by variation).
                  type: string
                  enum:
                  - overview
                  - audience
                  - post_test
                audience:
                  description: Audience breakdown dimension. Required when `view` is `audience`. Optional when `view` is `post_test` (returns the post-test breakdown by the selected dimension). Not allowed when `view` is `overview`. Use one of the supported audience fields such as `device_type`, `visitor_type`, or `source_channel`.
                  type: string
                  enum:
                  - device_type
                  - visitor_type
                  - source_channel
                  - source_site
                  - country_code
                  - landing_page_full_path
                includeInTestOrders:
                  default: true
                  description: Only applies when `view` is `post_test`. Controls whether in-test orders are folded into the metrics. When `true` (default), the in-test `eso_*` family is included and `total_*` is the LTV view (post-test + in-test combined). When `false`, the `eso_*` family is omitted and `total_*` collapses to equal `post_*`. The `post_*` family and headcounts/rates are always returned.
                  type: boolean
                analyticsViewType:
                  description: Optional analytics view preset used by the backend when building the analysis request.
                  type: string
                  enum:
                  - test_orders_only
                  - sitewide_orders
                  - none
                endTs:
                  description: Optional analysis end timestamp as a 10-digit Unix epoch string in seconds (not milliseconds). Maps directly to the backend `endTs` field.
                  type: string
                startTs:
                  description: Optional analysis start timestamp as a 10-digit Unix epoch string in seconds (not milliseconds). Maps directly to the backend `startTs` field.
                  type: string
                graphs:
                  type: object
                  properties:
                    ids:
                      description: 'Array of graph IDs to render in the response. Valid values (30): conversion_rate, add_to_cart_rate, abandoned_cart_rate, abandoned_checkout_rate, checkout_begin_rate, checkout_enter_contact_info_rate, checkout_address_submitted_rate, view_product_page_rate, view_collection_page_rate, net_revenue_per_visitor, net_revenue_per_order, net_product_revenue_per_order, net_shipping_revenue_per_order, avg_units_per_order, avg_product_revenue_per_unit, profit_per_visitor, subscription_product_revenue_per_order, subscription_revenue_per_order, subscription_orders_per_visitor, subscription_revenue_per_visitor, subscription_profit_per_visitor, profit_per_order, pct_orders_free_shipping, avg_discount_per_discounted_order, avg_discount_per_all_orders, pct_subscription_orders, pct_orders_with_post_purchase_offer, net_revenue_from_post_purchase_offer, pct_orders_with_upsell, net_revenue_from_upsell. Note that ''revenue_per_visitor'' is NOT valid — use ''net_revenue_per_visitor''.'
                      type: array
                      items:
                        type: string
                        enum:
                        - conversion_rate
                        - add_to_cart_rate
                        - abandoned_cart_rate
                        - abandoned_checkout_rate
                        - checkout_begin_rate
                        - checkout_enter_contact_info_rate
                        - checkout_address_submitted_rate
                        - view_product_page_rate
                        - view_collection_page_rate
                        - net_revenue_per_visitor
                        - net_revenue_per_order
                        - net_product_revenue_per_order
                        - net_shipping_revenue_per_order
                        - avg_units_per_order
                        - avg_product_revenue_per_unit
                        - profit_per_visitor
                        - subscription_product_revenue_per_order
                        - subscription_revenue_per_order
                        - subscription_orders_per_visitor
                        - subscription_revenue_per_visitor
                        - subscription_profit_per_visitor
                        - profit_per_order
                        - pct_orders_free_shipping
                        - avg_discount_per_discounted_order
                        - avg_discount_per_all_orders
                        - pct_subscription_orders
                        - pct_orders_with_post_purchase_offer
                        - net_revenue_from_post_purchase_offer
                        - pct_orders_with_upsell
                        - net_revenue_from_upsell
                    outputFormat:
                      description: Graph output format. Use `png` for signed image URLs or `base64` to inline the PNG data in the response.
                      type: string
                      enum:
                      - png
                      - base64
                filters:
                  description: 'Structured analytics filters object for `POST /analytics/resource/{experienceId}`. This replaces the deprecated GET endpoint''s query-parameter filter pattern and supports device, visitor, traffic source, URL, user behavior, revenue, custom event, product, and targeting filters.


                    Analytics filters object for narrowing experience/experiment result data.'
                  type: object
                  properties:
                    deviceType:
                      description: 'Filter by device type. Options: ''any'' (disables filter), ''mobile'', ''desktop''. Omit or null to include all devices.'
                      anyOf:
                      - type: string
                        enum:
                        - any
                        - mobile
                        - desktop
                      - type: 'null'
                    visitorType:
                      description: 'Filter by visitor type. Options: ''any'' (disables filter), ''new'', ''returning''. Omit or null to include all visitors.'
                      anyOf:
                      - type: string
                        enum:
                        - any
                        - new
                        - returning
                      - type: 'null'
                    customerType:
                      description: 'Filter experiment analytics by customer type. Options: ''new'', ''returning''. Omit or null to include all customers.'
                      anyOf:
                      - type: string
                        enum:
                        - new
                        - returning
                      - type: 'null'
                    sourceSitesOrChannels:
                      description: 'Filter by traffic source channels. These 25 values are the complete accepted set — the channels the analytics service buckets sessions and orders into — and any other value is rejected with a 400: ''Instagram'', ''Facebook'', ''Google'', ''Twitter'', ''TikTok'', ''Youtube'', ''Klaviyo'', ''Attentive'', ''Postscript'', ''Paid Shopping'', ''Paid Search'', ''Paid Social'', ''Paid Video'', ''Display'', ''Paid Other'', ''Organic Shopping'', ''Organic Social'', ''Organic Video'', ''Organic Search'', ''Other'', ''Referral'', ''Affiliate'', ''SMS'', ''Email'', ''Direct''. Omit or pass an empty array for all channels — there is no ''any'' sentinel.'
                      type: array
                      items:
                        type: string
                        enum:
                        - Instagram
                        - Facebook
                        - Google
                        - Twitter
                        - TikTok
                        - Youtube
                        - Klaviyo
                        - Attentive
                        - Postscript
                        - Paid Shopping
                        - Paid Search
                        - Paid Social
                        - Paid Video
                        - Display
                        - Paid Other
                        - Organic Shopping
                        - Organic Social
                        - Organic Video
                        - Organic Search
                        - Other
                        - Referral
                        - Affiliate
                        - SMS
                        - Email
                        - Direct
                    urlParam:
                      description: 'Filter by URL query parameter. Object with: queryParam (string|null — the parameter name), queryParamValue (string|null — the value to match), queryParamFilterType (match operator|null: ''equals'', ''contains'', ''startsWith'', ''endsWith'', ''doesNotEqual'', ''doesNotContain'', ''doesNotStartWith'', ''doesNotEndWith'', ''isNull'', ''isNotNull''). REQUIRED COMBINATIONS (enforced with a 400): when queryParamFilterType is set, queryParam must be a non-empty string; every operator except ''isNull''/''isNotNull'' also requires a non-empty queryParamValue; ''isNull''/''isNotNull'' take no value, so leave queryParamValue null. Omit all three fields to apply no query-parameter filter.'
                      type: object
                      properties:
                        queryParam:
                          anyOf:
                          - type: string
                          - type: 'null'
                        queryParamValue:
                          anyOf:
                          - type: string
                          - type: 'null'
                        queryParamFilterType:
                          anyOf:
                          - type: string
                            enum:
                            - equals
                            - contains
                            - startsWith
                            - endsWith
                            - doesNotEqual
                            - doesNotContain
                            - doesNotStartWith
                            - doesNotEndWith
                            - isNull
                            - isNotNull
                          - type: 'null'
                      required:
                      - queryParam
                      - queryParamValue
                      - queryParamFilterType
                    landingPage:
                      description: 'DEPRECATED — use landingPageFilters instead, which supports multiple values and an and/or operator. This single-path filter is retained for backwards compatibility and still works, but new integrations should use landingPageFilters. Filter by landing page URL path. Object with: landingPageUrlPath (string|null — the path to match), landingPageUrlPathFilterType (match operator|null: ''equals'', ''contains'', ''startsWith'', ''endsWith'', ''doesNotEqual'', ''doesNotContain'', ''doesNotStartWith'', ''doesNotEndWith'', ''isNull'', ''isNotNull''). REQUIRED COMBINATIONS (enforced with a 400): every operator except ''isNull''/''isNotNull'' requires a non-empty landingPageUrlPath; ''isNull''/''isNotNull'' take no path, so leave landingPageUrlPath null; and a landingPageUrlPath with no landingPageUrlPathFilterType is rejected. Omit both fields to apply no landing-page filter.'
                      deprecated: true
                      anyOf:
                      - type: object
                        properties:
                          landingPageUrlPath:
                            anyOf:
                            - type: string
                            - type: 'null'
                          landingPageUrlPathFilterType:
                            anyOf:
                            - type: string
                              enum:
                              - equals
                              - contains
                              - startsWith
                              - endsWith
                              - doesNotEqual
                              - doesNotContain
                              - doesNotStartWith
                              - doesNotEndWith
                              - isNull
                              - isNotNull
                            - type: 'null'
                        required:
                        - landingPageUrlPath
                        - landingPageUrlPathFilterType
                      - type: 'null'
                    landingPageFilters:
                      description: 'Filter by landing page URL path with multi-value support. Recommended landing page filter (supersedes the deprecated landingPage field). Array of filter items, each with: filterType (match operator: ''equals'', ''contains'', ''startsWith'', ''endsWith'', ''doesNotEqual'', ''doesNotContain'', ''doesNotStartWith'', ''doesNotEndWith'', ''isNull'', ''isNotNull'') and values (array of strings to match against). REQUIRED COMBINATIONS (enforced with a 400): every operator except ''isNull''/''isNotNull'' requires at least one non-empty entry in values — an omitted, empty, or blank-only values array is rejected rather than silently matching nothing. ''isNull''/''isNotNull'' take no values; omit the field (an empty array is tolerated, real values are rejected). Multiple values within a single item are OR''d. How items in the array are combined is controlled by landingPageFiltersOperator.'
                      type: array
                      items:
                        type: object
                        properties:
                          values:
                            type: array
                            items:
                              type: string
                          filterType:
                            type: string
                            enum:
                            - equals
                            - contains
                            - startsWith
                            - endsWith
                            - doesNotEqual
                            - doesNotContain
                            - doesNotStartWith
                            - doesNotEndWith
                            - isNull
                            - isNotNull
                        required:
                        - filterType
                    landingPageFiltersOperator:
                      description: How multiple items in landingPageFilters are combined. 'or' (default) — session matches if any filter item matches. 'and' — session must match every filter item.
                      type: string
                      enum:
                      - or
                      - and
                    userBehavior:
                      description: 'Filter by visitor browsing behavior. Object with optional boolean flags: viewedCheckout, addedToCart, viewedProductPage, viewedCollectionPage. Set a flag to true to include only visitors who performed that action. Omit or null for flags you don''t want to filter on. Multiple true flags are combined with AND logic.'
                      type: object
                      properties:
                        viewedCheckout:
                          anyOf:
                          - type: boolean
                          - type: 'null'
                        addedToCart:
                          anyOf:
                          - type: boolean
                          - type: 'null'
                        viewedProductPage:
                          anyOf:
                          - type: boolean
                          - type: 'null'
                        viewedCollectionPage:
                          anyOf:
                          - type: boolean
                          - type: 'null'
                    countryCodes:
                      description: Filter by ISO 3166-1 alpha-2 country codes (e.g. ['US', 'GB', 'CA']). Omit or pass empty array for all countries.
                      type: array
                      items:
                        type: string
                    countryCodesFilterType:
                      description: 'How countryCodes should be matched: ''include'' (only visitors in the listed countries) or ''exclude'' (visitors in any country except the listed ones). Defaults to ''include'' when omitted. Requires countryCodes to be a non-empty array.'
                      type: string
                      enum:
                      - include
